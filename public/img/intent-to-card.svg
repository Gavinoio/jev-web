<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc"><title id="title">从自然语言到可确认卡片</title><desc id="desc">用户输入、意图判断、本地代码计算、用户确认四步分工示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, sans-serif"><g fill="#0f1c33" stroke="#29415b"><rect x="2" y="15" width="270" height="145" rx="16"/><rect x="310" y="15" width="195" height="145" rx="16" stroke="#38bdf8"/><rect x="543" y="15" width="215" height="145" rx="16" stroke="#a78bfa"/><rect x="796" y="15" width="202" height="145" rx="16" stroke="#34d399"/></g><g stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"><path d="M280 86h20"/><path d="M513 86h20"/><path d="M766 86h20"/></g><g font-size="15" fill="#8da2c0"><text x="24" y="46">INPUT / 用户输入</text><text x="331" y="46" fill="#38bdf8">DECIDE / 判断</text><text x="564" y="46" fill="#a78bfa">COMPUTE / 计算</text><text x="817" y="46" fill="#34d399">CONFIRM / 确认</text></g><g font-size="21" fill="#e8eef9" font-weight="700"><text x="24" y="87">“明天中午和小王吃饭”</text><text x="331" y="87">意图：日程</text><text x="564" y="87">解析时间、人物</text><text x="817" y="87">预览并保存</text></g><g font-size="16" fill="#bfd6ee"><text x="24" y="124">自然语言逐渐写完整</text><text x="331" y="124">或手动选择类型</text><text x="564" y="124">日期与数值交给代码</text><text x="817" y="124">不自动执行外部操作</text></g><text x="500" y="184" text-anchor="middle" fill="#8da2c0" font-size="14">本场意图结果来自离线预设；示意图展示分工，不代表真实模型测量。</text></g></svg>
