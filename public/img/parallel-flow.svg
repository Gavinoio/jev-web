<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">逐词生成与结构化并行输出</title>
  <desc id="desc">对比逐词生成文本的步骤和结构化问题一次返回多项判断结果的示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111a32"/>
      <stop offset="1" stop-color="#0a1021"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#33d5d5"/>
      <stop offset="1" stop-color="#70e1bc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#92a3c1"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#43d6c9"/>
    </marker>
  </defs>
  <rect width="880" height="500" rx="28" fill="url(#bg)"/>
  <text x="440" y="55" fill="#f3f6ff" text-anchor="middle" font-size="27" font-weight="700" font-family="system-ui, 'Microsoft YaHei', sans-serif">两种不同的输出路径</text>
  <rect x="28" y="88" width="398" height="360" rx="20" fill="#202b43" stroke="#41506b"/>
  <rect x="454" y="88" width="398" height="360" rx="20" fill="#102b37" stroke="#26757b"/>
  <text x="227" y="128" fill="#d7dfef" text-anchor="middle" font-size="21" font-weight="700" font-family="system-ui, 'Microsoft YaHei', sans-serif">逐词生成文本</text>
  <text x="653" y="128" fill="#bdf8eb" text-anchor="middle" font-size="21" font-weight="700" font-family="system-ui, 'Microsoft YaHei', sans-serif">结构化问题与选项</text>
  <text x="227" y="163" fill="#9daecc" text-anchor="middle" font-size="14" font-family="system-ui, 'Microsoft YaHei', sans-serif">每一步依赖此前生成的内容</text>
  <text x="653" y="163" fill="#9dc8c6" text-anchor="middle" font-size="14" font-family="system-ui, 'Microsoft YaHei', sans-serif">预先定义题目和可选结果</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="16" font-weight="600" text-anchor="middle">
    <rect x="66" y="215" width="76" height="54" rx="12" fill="#313e59" stroke="#7585a3"/><text x="104" y="248" fill="#e5ebf6">token 1</text>
    <rect x="174" y="215" width="76" height="54" rx="12" fill="#313e59" stroke="#7585a3"/><text x="212" y="248" fill="#e5ebf6">token 2</text>
    <rect x="282" y="215" width="76" height="54" rx="12" fill="#313e59" stroke="#7585a3"/><text x="320" y="248" fill="#e5ebf6">token 3</text>
    <path d="M144 242h25M252 242h25" stroke="#92a3c1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="385" y="248" fill="#9daecc">…</text>
  </g>
  <path d="M104 295v34h108v-34M212 295v34h108v-34" fill="none" stroke="#596a88" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="227" y="366" fill="#b0bdd3" text-anchor="middle" font-size="16" font-family="system-ui, 'Microsoft YaHei', sans-serif">按序生成，内容越长步骤越多</text>
  <rect x="493" y="207" width="111" height="67" rx="14" fill="#14495a" stroke="#3aabb1" stroke-width="2"/>
  <text x="548" y="235" fill="#e5fffa" text-anchor="middle" font-size="15" font-weight="700" font-family="system-ui, 'Microsoft YaHei', sans-serif">一次请求</text>
  <text x="548" y="256" fill="#9ce7db" text-anchor="middle" font-size="12" font-family="system-ui, 'Microsoft YaHei', sans-serif">题目 + 材料</text>
  <g fill="url(#teal)" stroke="#72e5c9" stroke-width="1.5">
    <rect x="703" y="190" width="106" height="38" rx="10"/>
    <rect x="703" y="240" width="106" height="38" rx="10"/>
    <rect x="703" y="290" width="106" height="38" rx="10"/>
    <rect x="703" y="340" width="106" height="38" rx="10"/>
  </g>
  <g fill="#10313b" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="756" y="214">选项 A</text><text x="756" y="264">选项 B</text><text x="756" y="314">选项 C</text><text x="756" y="364">把握度</text>
  </g>
  <g fill="none" stroke="#43d6c9" stroke-width="2.5" marker-end="url(#arrowTeal)">
    <path d="M610 227 686 209"/><path d="M610 238 686 258"/><path d="M610 248 686 308"/><path d="M610 258 686 358"/>
  </g>
  <text x="653" y="414" fill="#a9d9d2" text-anchor="middle" font-size="15" font-family="system-ui, 'Microsoft YaHei', sans-serif">并行返回预先定义的概率分布</text>
  <text x="440" y="477" fill="#8795ad" text-anchor="middle" font-size="12" font-family="system-ui, 'Microsoft YaHei', sans-serif">原理示意：不代表具体实现细节或端到端延迟</text>
</svg>
