<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" role="img" aria-labelledby="title desc"><title id="title">从历史工单到小流量验证</title><desc id="desc">脱敏标注，保留独立测试集，比较方案，影子运行，达到标准后小流量上线并保留回退。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#53708c" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#0f1c33" stroke="#29415b"><rect x="2" y="15" width="180" height="112" rx="16"/><rect x="205" y="15" width="180" height="112" rx="16"/><rect x="408" y="15" width="180" height="112" rx="16"/><rect x="611" y="15" width="180" height="112" rx="16"/><rect x="814" y="15" width="184" height="112" rx="16" stroke="#34d399"/></g><g stroke="#53708c" stroke-width="2" marker-end="url(#arrow)"><path d="M184 70h16"/><path d="M387 70h16"/><path d="M590 70h16"/><path d="M793 70h16"/></g><g fill="#38bdf8" font-size="14"><text x="92" y="43">01 / 准备</text><text x="295" y="43">02 / 隔离</text><text x="498" y="43">03 / 对照</text><text x="701" y="43">04 / 观察</text><text x="906" y="43" fill="#34d399">05 / 达标后</text></g><g fill="#e8eef9" font-size="21" font-weight="700"><text x="92" y="77">脱敏与标注</text><text x="295" y="77">独立测试集</text><text x="498" y="77">同标准比较</text><text x="701" y="77">影子运行</text><text x="906" y="77">小流量试点</text></g><g fill="#8da2c0" font-size="15"><text x="92" y="106">覆盖边界与反例</text><text x="295" y="106">不参与反复调题</text><text x="498" y="106">质量 / 延迟 / 成本</text><text x="701" y="106">不改变现有流程</text><text x="906" y="106">保留人工与回退</text><text x="500" y="157">未达标：分析错误、修改标准或更换方案，再验证；不直接替换现有系统。</text></g></g></svg>
