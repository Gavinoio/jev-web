<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
<title id="title">工单判断的数据流</title><desc id="desc">材料和题目输入判断模型，返回结构化结果，程序按规则决定后续动作；结果仅为示意。</desc>
<defs><linearGradient id="bg"><stop stop-color="#10243d"/><stop offset="1" stop-color="#18213d"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/></marker></defs>
<g font-family="Microsoft YaHei, sans-serif"><rect x="2" y="10" width="280" height="160" rx="18" fill="#0f1c33" stroke="#38bdf8"/><text x="24" y="43" fill="#38bdf8" font-size="15">01 / 材料 + 题目</text><path d="M25 62h234M25 117h234" stroke="#29415b"/><text x="24" y="88" fill="#e8eef9" font-size="19">“充值后一直没到账”</text><text x="24" y="145" fill="#bfd6ee" font-size="17">首接团队？是否紧急？</text>
<path d="M294 90h42" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="35" width="180" height="110" rx="22" fill="url(#bg)" stroke="#a78bfa"/><text x="440" y="82" text-anchor="middle" fill="#e8eef9" font-size="29" font-weight="700">Jev</text><text x="440" y="116" text-anchor="middle" fill="#b5a3e7" font-size="16">限定目标的判断</text>
<path d="M542 90h40" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="598" y="10" width="230" height="160" rx="18" fill="#0f1c33" stroke="#34d399"/><text x="618" y="43" fill="#34d399" font-size="15">02 / 结构化结果</text><text x="618" y="82" fill="#e8eef9" font-size="20">department: billing</text><text x="618" y="115" fill="#bfd6ee" font-size="17">选项 · 概率 · 把握度</text><text x="618" y="148" fill="#8da2c0" font-size="14">接口形状示意，非实测</text>
<path d="M840 90h28" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/><text x="940" y="70" text-anchor="middle" fill="#38bdf8" font-size="15">03 / 程序</text><rect x="884" y="86" width="112" height="44" rx="10" fill="#10302e" stroke="#34d399"/><text x="940" y="114" text-anchor="middle" fill="#e8eef9" font-size="18">按规则路由</text></g></svg>
